[project]
name = "ai-knowledge-base-builder"
version = "0.1.0"
description = "Offline-first, resumable PDF to Markdown knowledge-base builder"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
docling = ["docling>=2.60,<3; python_version < '3.14'"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[project.scripts]
kb = "knowledge_builder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
